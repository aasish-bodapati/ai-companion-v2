[pytest]
addopts = -q
testpaths =
    tests
log_level = WARNING
filterwarnings =
    # Third-party deprecations
    ignore::DeprecationWarning:jose.jwt
    ignore::DeprecationWarning:sqlalchemy.sql.schema
    ignore::DeprecationWarning:faiss.loader
    # Generic utcnow deprecation noise from dependencies
    ignore:.*datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning
    # Pytest cache warnings on Windows permission-restricted dirs (no category specified for compatibility)
    ignore:could not create cache path .*
markers =
    timeout: mark test with a timeout in seconds
