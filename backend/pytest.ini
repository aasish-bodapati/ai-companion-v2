[pytest]
addopts = -vv -rA --durations=15 --color=yes --tb=short
asyncio_mode = auto
testpaths =
    tests
log_level = WARNING
log_cli = true
log_cli_level = INFO
console_output_style = progress
filterwarnings =
    # Third-party deprecations
    ignore::DeprecationWarning:jose.jwt
    ignore::DeprecationWarning:sqlalchemy.sql.schema
    ignore::DeprecationWarning:faiss.loader
    # Generic utcnow deprecation noise from dependencies
    ignore:.*datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning
    # Pytest cache warnings on Windows permission-restricted dirs (no category specified for compatibility)
    ignore:could not create cache path .*

markers =
    # Test categories
    unit: mark test as unit test (fast, isolated)
    integration: mark test as integration test (medium speed, component interaction)
    e2e: mark test as end-to-end test (slow, full system)
    performance: mark test as performance test (timing sensitive)
    
    # Feature areas
    memory: memory-related functionality
    auth: authentication and authorization
    api: API endpoints
    database: database operations
    llm: LLM integration
    conversation: conversation management
    scheduler: scheduling functionality
    
    # Test characteristics
    slow: mark test as slow/long-running (>1s)
    timeout: mark test with a timeout in seconds
    flaky: mark test as potentially flaky
    smoke: mark test as smoke test (critical path)
    
    # CI/CD
    ci: mark test for CI pipeline
    local: mark test for local development only
