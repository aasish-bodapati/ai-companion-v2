name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20]
        test-type: [unit, integration, e2e]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run ${{ matrix.test-type }} tests
      working-directory: ./frontend
      run: |
        if [ "${{ matrix.test-type }}" = "unit" ]; then
          npm run test:unit -- --coverage --outputFile=test-results-unit.txt
        elif [ "${{ matrix.test-type }}" = "integration" ]; then
          npm run test:integration -- --coverage --outputFile=test-results-integration.txt
        elif [ "${{ matrix.test-type }}" = "e2e" ]; then
          npx playwright install
          npm run test:e2e -- --outputFile=test-results-e2e.txt
        fi
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.test-type }}-${{ matrix.node-version }}
        path: frontend/test-results-*.txt
    
    - name: Upload coverage reports
      if: matrix.test-type != 'e2e'
      uses: actions/upload-artifact@v3
      with:
        name: coverage-${{ matrix.test-type }}-${{ matrix.node-version }}
        path: frontend/coverage/
    
    - name: Test Summary
      run: |
        echo "=== Test Results for ${{ matrix.test-type }} tests ==="
        if [ -f "frontend/test-results-${{ matrix.test-type }}.txt" ]; then
          cat "frontend/test-results-${{ matrix.test-type }}.txt"
        else
          echo "No test results file found"
        fi

  test-all:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Install Playwright browsers
      working-directory: ./frontend
      run: npx playwright install
    
    - name: Run all tests
      working-directory: ./frontend
      run: |
        npm run test:all -- --coverage --outputFile=test-results-all.txt
    
    - name: Upload all test results
      uses: actions/upload-artifact@v3
      with:
        name: test-results-all
        path: frontend/test-results-all.txt
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-all
        path: frontend/coverage/
    
    - name: Final Test Summary
      run: |
        echo "=== Final Test Results ==="
        if [ -f "frontend/test-results-all.txt" ]; then
          cat "frontend/test-results-all.txt"
        else
          echo "No test results file found"
        fi

  build:
    runs-on: ubuntu-latest
    needs: test-all
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Build application
      working-directory: ./frontend
      run: npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: frontend/.next/

