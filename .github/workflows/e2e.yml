name: E2E Tests

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'  # nightly at 03:00 UTC

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Add timeout to prevent hanging
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_companion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_companion" 
          --health-interval 5s 
          --health-timeout 5s 
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_companion
      WEB_BASE: http://localhost:3000
      API_BASE: http://localhost:8000/api/v1
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DB migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Start backend (FastAPI)
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir . > ../backend.log 2>&1 &

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci

      - name: Start frontend (Next.js)
        working-directory: frontend
        run: |
          nohup npm run dev > ../frontend.log 2>&1 &

      - name: Wait for servers
        run: |
          sleep 30  # Simple wait instead of complex health checks

      - name: Run basic backend tests
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python -m pytest tests/ -m "not slow" -v --maxfail=3
