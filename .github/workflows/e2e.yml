name: E2E Tests

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'  # nightly at 03:00 UTC

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_companion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_companion" 
          --health-interval 5s 
          --health-timeout 5s 
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_companion
      WEB_BASE: http://localhost:3000
      API_BASE: http://localhost:8000/api/v1
      NEXT_TELEMETRY_DISABLED: '1'
      # Enable timeline diagnostics end-to-end
      TIMELINE_ENABLED: 'true'
      NEXT_PUBLIC_FEATURE_TIMELINE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DB migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Start backend (FastAPI)
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir . > ../backend.log 2>&1 &

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Start frontend (Next.js)
        working-directory: frontend
        run: |
          nohup npm run dev > ../frontend.log 2>&1 &

      - name: Wait for servers
        run: |
          npx wait-on http://localhost:8000/api/v1/openapi.json http://localhost:3000

      - name: Run Memory Audit integration tests (pytest)
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          pytest -q ../tests/integration/test_memory_audit.py --maxfail=1

      - name: Run Playwright smoke tests
        working-directory: frontend
        run: |
          npm run test:e2e:smoke

      - name: Run Jarvis Journey E2E
        working-directory: frontend
        run: |
          npm run test:e2e -- tests/jarvis_journey.spec.ts

      - name: Run Flow/Coherence test (soft gate)
        env:
          CHAT_API_BASE: http://localhost:8000
          CHAT_USER_EMAIL: test@example.com
          CHAT_USER_PASSWORD: testpassword123
        run: |
          # Run the Python flow test without failing the job on exceptions
          python scripts/chat_flow_test.py || echo "Flow test exited non-zero; continuing to check report"
          
          # Enforce threshold only if the report exists
          python - << 'PY'
          import json, sys, os
          report = os.path.join('reports', 'chat_simulation_scores.json')
          if not os.path.exists(report):
              print('::warning::Flow report not found; skipping gate (configure test credentials to enable).')
              sys.exit(0)
          with open(report, 'r', encoding='utf-8') as f:
              data = json.load(f)
          pct = float(data.get('overall', {}).get('pct', 0.0))
          print(f"Flow/Coherence score: {pct:.1f}%")
          if pct < 70.0:
              print('::error::Flow/Coherence score below threshold (70%). Failing job to prevent regressions.')
              sys.exit(1)
          sys.exit(0)
          PY

      - name: Aggregate Chat Metrics from backend logs
        run: |
          python scripts/aggregate_chat_metrics.py --log backend.log --out reports/chat_metrics_summary.json || echo "Aggregation skipped (no logs)"

      - name: Upload Chat Metrics Summary (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-metrics-summary
          path: reports/chat_metrics_summary.json
          retention-days: 7

      - name: Run Uploads/Vision E2E (nightly only)
        if: github.event_name == 'schedule'
        working-directory: frontend
        run: |
          npm run test:e2e -- tests/uploads.spec.ts

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Post test docs links to summary (always)
        if: always()
        run: |
          {
            echo "## Test & Runbook Links";
            echo "- Calendar Runbook: docs/runbook_calendar.md";
            echo "- Capabilities (slash commands, fast-path deletion, flags): docs/CAPABILITIES.md";
            echo "- MVP Delivery Plan & Roadmap: docs/MVP_DELIVERY_PLAN.md";
            echo "- Playwright Smoke Scope: frontend/tests/working_chat_test.spec.ts (@smoke)";
          } >> "$GITHUB_STEP_SUMMARY"
