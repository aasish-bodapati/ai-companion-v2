name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Check Python basics
      working-directory: ./backend
      run: |
        python --version
        python -c "print('Python is working')"
        python -c "import sys; print('Python path:'); [print(f'  {p}') for p in sys.path]"
    
    - name: Check file structure
      working-directory: ./backend
      run: |
        pwd
        ls -la
        echo "--- Tests directory ---"
        ls -la tests/
        echo "--- App directory ---"
        ls -la app/
    
    - name: Check basic imports
      working-directory: ./backend
      run: |
        python -c "import pytest; print('✅ pytest imported successfully')"
        python -c "import fastapi; print('✅ fastapi imported successfully')"
        python -c "import sqlalchemy; print('✅ sqlalchemy imported successfully')"
    
    - name: Try to import app
      working-directory: ./backend
      run: |
        python -c "import app; print('✅ app package imported successfully')"
        python -c "from app import main; print('✅ app.main imported successfully')"
        python -c "from app.main import app; print('✅ app.main.app imported successfully')"

