name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio
    
    - name: Check Python path
      working-directory: ./backend
      run: |
        python -c "import sys; print('Python path:'); [print(f'  {p}') for p in sys.path]"
        python -c "import os; print('Current directory:', os.getcwd())"
        python -c "import os; print('Files in current directory:'); [print(f'  {f}') for f in os.listdir('.')]"
    
    - name: Check test discovery (no conftest)
      working-directory: ./backend
      run: |
        python -m pytest --collect-only --ignore=tests/conftest.py tests/ -q
    
    - name: Run single simple test
      working-directory: ./backend
      env:
        DATABASE_URL: sqlite:///./test.db
        SECRET_KEY: test-secret-key
        LLM_PROVIDER: stub
        STREAMING_ENABLED: true
      run: |
        python -m pytest tests/test_metrics_basic.py -v --tb=short

