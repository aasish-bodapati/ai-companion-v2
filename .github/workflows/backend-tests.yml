name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.11, 3.12]
        test-type: [unit, integration, e2e, performance]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-xdist
    
    - name: Run ${{ matrix.test-type }} tests
      working-directory: ./backend
      env:
        DATABASE_URL: sqlite:///./test.db
        MEMORY_ENABLED: true
        LLM_BASE_URL: https://openrouter.ai/api/v1
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python run_tests.py --type ${{ matrix.test-type }} --coverage --parallel --output-file test-results-${{ matrix.test-type }}.txt
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.test-type }}-${{ matrix.python-version }}
        path: backend/test-results-*.txt
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-${{ matrix.test-type }}-${{ matrix.python-version }}
        path: backend/htmlcov/
    
    - name: Test Summary
      run: |
        echo "=== Test Results for ${{ matrix.test-type }} tests ==="
        if [ -f "backend/test-results-${{ matrix.test-type }}.txt" ]; then
          cat "backend/test-results-${{ matrix.test-type }}.txt"
        else
          echo "No test results file found"
        fi

  test-all:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-xdist
    
    - name: Run all tests
      working-directory: ./backend
      env:
        DATABASE_URL: sqlite:///./test.db
        MEMORY_ENABLED: true
        LLM_BASE_URL: https://openrouter.ai/api/v1
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python run_tests.py --all --coverage --parallel --output-file test-results-all.txt
    
    - name: Upload all test results
      uses: actions/upload-artifact@v3
      with:
        name: test-results-all
        path: backend/test-results-all.txt
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-all
        path: backend/htmlcov/
    
    - name: Final Test Summary
      run: |
        echo "=== Final Test Results ==="
        if [ -f "backend/test-results-all.txt" ]; then
          cat "backend/test-results-all.txt"
        else
          echo "No test results file found"
        fi

