<!DOCTYPE html>
<html>
<head>
    <title>Exercise API Test</title>
</head>
<body>
    <h1>Exercise API Test</h1>
    <div id="results"></div>
    
    <script>
        async function testExerciseAPI() {
            try {
                const response = await fetch('http://localhost:8000/api/v1/health/exercises/search?q=push&limit=3');
                const data = await response.json();
                
                console.log('API Response:', data);
                
                document.getElementById('results').innerHTML = `
                    <h2>API Response:</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    
                    <h2>Exercise Categories:</h2>
                    <ul>
                        ${data.exercises.map(ex => `<li>${ex.name} - Category: ${ex.logging_category}</li>`).join('')}
                    </ul>
                `;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('results').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
        
        testExerciseAPI();
    </script>
</body>
</html>
