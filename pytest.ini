[pytest]
addopts = --ignore=backend/test_real_conversation.py -m "not slow"
testpaths =
    tests
markers =
    slow: mark test as slow/long-running
    timeout: mark test with a timeout in seconds
    conflict_detection: schedule conflict detection focused tests
    integration: integration tests hitting external services or multiple subsystems
log_level = WARNING
log_cli = true
log_cli_level = INFO
console_output_style = progress
filterwarnings =
    # Suppress tests returning values (transition period)
    ignore::pytest.PytestReturnNotNoneWarning
    # Generic utcnow deprecation noise from dependencies
    ignore:.*datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning
    # SQLAlchemy module-level deprecations
    ignore::DeprecationWarning:sqlalchemy.sql.schema
    # Third-party deprecations we don't control
    ignore::DeprecationWarning:jose.jwt
    ignore::DeprecationWarning:faiss.loader
