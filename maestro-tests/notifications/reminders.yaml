appId: com.healthlog.mobile

---
- launchApp
- assertVisible: "Welcome to HealthLog"

# Login first
- tapOn: "Login"
- inputText: "test@example.com"
- tapOn: "Password"
- inputText: "test123"
- tapOn: "Login"
- assertVisible: "Dashboard"

# Test workout reminder
- tapOn: "Profile"
- tapOn: "Settings"
- tapOn: "Notifications"
- tapOn: "Push Notifications"
- tapOn: "Workout Reminders"
- tapOn: "Enable Reminders"
- tapOn: "Reminder Time"
- tapOn: "7:00 AM"
- tapOn: "Save"
- tapOn: "Days of Week"
- tapOn: "Monday"
- tapOn: "Wednesday"
- tapOn: "Friday"
- tapOn: "Save"
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"
- assertVisible: "Dashboard"

# Test meal reminder
- tapOn: "Profile"
- tapOn: "Settings"
- tapOn: "Notifications"
- tapOn: "Push Notifications"
- tapOn: "Meal Reminders"
- tapOn: "Enable Reminders"
- tapOn: "Breakfast Reminder"
- tapOn: "Reminder Time"
- tapOn: "8:00 AM"
- tapOn: "Save"
- tapOn: "Back"
- tapOn: "Lunch Reminder"
- tapOn: "Reminder Time"
- tapOn: "12:00 PM"
- tapOn: "Save"
- tapOn: "Back"
- tapOn: "Dinner Reminder"
- tapOn: "Reminder Time"
- tapOn: "7:00 PM"
- tapOn: "Save"
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"
- assertVisible: "Dashboard"

# Test mood check-in reminder
- tapOn: "Profile"
- tapOn: "Settings"
- tapOn: "Notifications"
- tapOn: "Push Notifications"
- tapOn: "Mood Check-ins"
- tapOn: "Enable Reminders"
- tapOn: "Reminder Time"
- tapOn: "9:00 PM"
- tapOn: "Save"
- tapOn: "Frequency"
- tapOn: "Daily"
- tapOn: "Save"
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"
- assertVisible: "Dashboard"

# Test goal reminder
- tapOn: "Profile"
- tapOn: "Settings"
- tapOn: "Notifications"
- tapOn: "Push Notifications"
- tapOn: "Goal Updates"
- tapOn: "Enable Notifications"
- tapOn: "Progress Updates"
- tapOn: "Milestone Achievements"
- tapOn: "Goal Reminders"
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"
- assertVisible: "Dashboard"

# Test achievement notification
- tapOn: "Profile"
- tapOn: "Settings"
- tapOn: "Notifications"
- tapOn: "Push Notifications"
- tapOn: "Achievement Notifications"
- tapOn: "Enable Notifications"
- tapOn: "Workout Achievements"
- tapOn: "Nutrition Achievements"
- tapOn: "Streak Achievements"
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"
- assertVisible: "Dashboard"

# Test reminder scheduling
- tapOn: "Profile"
- tapOn: "Settings"
- tapOn: "Notifications"
- tapOn: "Reminder Schedule"
- assertVisible: "Reminder Schedule"
- assertVisible: "Workout Reminders"
- assertVisible: "Meal Reminders"
- assertVisible: "Mood Check-ins"
- assertVisible: "Goal Updates"

# Test reminder history
- tapOn: "Reminder History"
- assertVisible: "Reminder History"
- assertVisible: "Sent Reminders"
- assertVisible: "Scheduled Reminders"
- assertVisible: "Reminder Statistics"

# Test reminder customization
- tapOn: "Back"
- assertVisible: "Reminder Schedule"
- tapOn: "Customize Reminders"
- assertVisible: "Customize Reminders"
- assertVisible: "Reminder Tone"
- assertVisible: "Reminder Vibration"
- assertVisible: "Reminder Sound"
- tapOn: "Reminder Tone"
- assertVisible: "Select Tone"
- tapOn: "Default"
- tapOn: "Save"
- assertVisible: "Reminder tone updated"
