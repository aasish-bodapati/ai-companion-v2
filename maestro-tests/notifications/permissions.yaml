appId: com.healthlog.mobile

---
- launchApp
- assertVisible: "Welcome to HealthLog"

# Test notification permissions during onboarding
- tapOn: "Register"
- inputText: "Notification User"
- tapOn: "Email"
- inputText: "notification@example.com"
- tapOn: "Password"
- inputText: "password123"
- tapOn: "Create Account"
- assertVisible: "Account created successfully"

# Should prompt for notification permissions
- assertVisible: "Enable Notifications"
- assertVisible: "Get reminders for workouts, meals, and mood check-ins"
- tapOn: "Allow Notifications"
- assertVisible: "Notifications enabled"
- assertVisible: "Dashboard"

# Test notification settings
- tapOn: "Profile"
- tapOn: "Settings"
- tapOn: "Notifications"
- assertVisible: "Notification Settings"
- assertVisible: "Push Notifications"
- assertVisible: "Email Notifications"
- assertVisible: "Reminder Notifications"

# Test push notification settings
- tapOn: "Push Notifications"
- assertVisible: "Push Notification Settings"
- assertVisible: "Workout Reminders"
- assertVisible: "Meal Reminders"
- assertVisible: "Mood Check-ins"
- assertVisible: "Goal Updates"
- assertVisible: "Achievement Notifications"

# Test workout reminders
- tapOn: "Workout Reminders"
- assertVisible: "Workout Reminder Settings"
- assertVisible: "Enable Reminders"
- assertVisible: "Reminder Time"
- assertVisible: "Days of Week"
- tapOn: "Enable Reminders"
- assertVisible: "Workout reminders enabled"
- tapOn: "Reminder Time"
- assertVisible: "Select Time"
- tapOn: "7:00 AM"
- tapOn: "Save"
- assertVisible: "Reminder time set to 7:00 AM"
- tapOn: "Days of Week"
- assertVisible: "Select Days"
- tapOn: "Monday"
- tapOn: "Wednesday"
- tapOn: "Friday"
- tapOn: "Save"
- assertVisible: "Reminder days updated"

# Test meal reminders
- tapOn: "Back"
- assertVisible: "Push Notification Settings"
- tapOn: "Meal Reminders"
- assertVisible: "Meal Reminder Settings"
- assertVisible: "Enable Reminders"
- assertVisible: "Breakfast Reminder"
- assertVisible: "Lunch Reminder"
- assertVisible: "Dinner Reminder"
- tapOn: "Enable Reminders"
- assertVisible: "Meal reminders enabled"
- tapOn: "Breakfast Reminder"
- assertVisible: "Breakfast Reminder Settings"
- tapOn: "Reminder Time"
- assertVisible: "Select Time"
- tapOn: "8:00 AM"
- tapOn: "Save"
- assertVisible: "Breakfast reminder set to 8:00 AM"

# Test mood check-in reminders
- tapOn: "Back"
- assertVisible: "Push Notification Settings"
- tapOn: "Mood Check-ins"
- assertVisible: "Mood Check-in Settings"
- assertVisible: "Enable Reminders"
- assertVisible: "Reminder Time"
- assertVisible: "Frequency"
- tapOn: "Enable Reminders"
- assertVisible: "Mood check-in reminders enabled"
- tapOn: "Reminder Time"
- assertVisible: "Select Time"
- tapOn: "9:00 PM"
- tapOn: "Save"
- assertVisible: "Mood check-in reminder set to 9:00 PM"
- tapOn: "Frequency"
- assertVisible: "Select Frequency"
- tapOn: "Daily"
- tapOn: "Save"
- assertVisible: "Mood check-in frequency set to Daily"

# Test goal update notifications
- tapOn: "Back"
- assertVisible: "Push Notification Settings"
- tapOn: "Goal Updates"
- assertVisible: "Goal Update Settings"
- assertVisible: "Enable Notifications"
- assertVisible: "Progress Updates"
- assertVisible: "Milestone Achievements"
- assertVisible: "Goal Reminders"
- tapOn: "Enable Notifications"
- assertVisible: "Goal update notifications enabled"
- tapOn: "Progress Updates"
- assertVisible: "Progress update notifications enabled"
- tapOn: "Milestone Achievements"
- assertVisible: "Milestone achievement notifications enabled"

# Test achievement notifications
- tapOn: "Back"
- assertVisible: "Push Notification Settings"
- tapOn: "Achievement Notifications"
- assertVisible: "Achievement Notification Settings"
- assertVisible: "Enable Notifications"
- assertVisible: "Workout Achievements"
- assertVisible: "Nutrition Achievements"
- assertVisible: "Streak Achievements"
- tapOn: "Enable Notifications"
- assertVisible: "Achievement notifications enabled"
- tapOn: "Workout Achievements"
- assertVisible: "Workout achievement notifications enabled"
- tapOn: "Nutrition Achievements"
- assertVisible: "Nutrition achievement notifications enabled"
- tapOn: "Streak Achievements"
- assertVisible: "Streak achievement notifications enabled"

# Test notification permissions denial
- tapOn: "Back"
- assertVisible: "Push Notification Settings"
- tapOn: "Disable All Notifications"
- assertVisible: "Are you sure you want to disable all notifications?"
- tapOn: "Yes"
- assertVisible: "All notifications disabled"
- assertVisible: "Push Notifications"
- assertVisible: "Notifications are disabled"

# Test re-enabling notifications
- tapOn: "Enable Notifications"
- assertVisible: "Enable Notifications"
- assertVisible: "Allow Notifications"
- tapOn: "Allow Notifications"
- assertVisible: "Notifications enabled"
- assertVisible: "Push Notifications"
