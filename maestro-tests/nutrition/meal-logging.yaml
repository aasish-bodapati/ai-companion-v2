appId: com.healthlog.mobile

---
- launchApp
- assertVisible: "Welcome to HealthLog"

# Login first
- tapOn: "Login"
- inputText: "test@example.com"
- tapOn: "Password"
- inputText: "test123"
- tapOn: "Login"
- assertVisible: "Dashboard"

# Navigate to Nutrition
- tapOn: "Nutrition"
- assertVisible: "Nutrition"
- assertVisible: "Track your meals and nutrition"
- assertVisible: "Overview"

# Test quick meal logging via floating button
- tapOn: "+"
- assertVisible: "Quick Add"
- tapOn: "Log Meal"
- assertVisible: "Log Meal"
- assertVisible: "Meal Type"
- assertVisible: "Meal Name"
- assertVisible: "Calories"

# Test meal form completion
- tapOn: "Meal Type"
- tapOn: "Breakfast"
- tapOn: "Meal Name"
- inputText: "Protein Oatmeal"
- tapOn: "Calories"
- inputText: "450"
- tapOn: "Protein (g)"
- inputText: "25"
- tapOn: "Carbs (g)"
- inputText: "45"
- tapOn: "Fat (g)"
- inputText: "12"
- tapOn: "Notes"
- inputText: "Pre-workout meal"
- tapOn: "Save Meal"
- assertVisible: "Meal logged successfully"
- assertVisible: "Nutrition"

# Test meal logging from nutrition screen
- tapOn: "Overview"
- assertVisible: "Nutrition Overview"
- tapOn: "Log Meal"
- assertVisible: "Log Meal"
- tapOn: "Meal Type"
- tapOn: "Lunch"
- tapOn: "Meal Name"
- inputText: "Chicken Salad"
- tapOn: "Calories"
- inputText: "350"
- tapOn: "Protein (g)"
- inputText: "30"
- tapOn: "Carbs (g)"
- inputText: "20"
- tapOn: "Fat (g)"
- inputText: "15"
- tapOn: "Save Meal"
- assertVisible: "Meal logged successfully"

# Test meal logging validation
- tapOn: "Log Meal"
- assertVisible: "Log Meal"
- tapOn: "Save Meal"
- assertVisible: "Please fill in all required fields"
- tapOn: "Meal Type"
- tapOn: "Dinner"
- tapOn: "Meal Name"
- inputText: "Grilled Salmon"
- tapOn: "Calories"
- inputText: "400"
- tapOn: "Save Meal"
- assertVisible: "Meal logged successfully"

# Test meal logging with food items
- tapOn: "Log Meal"
- assertVisible: "Log Meal"
- tapOn: "Meal Type"
- tapOn: "Snack"
- tapOn: "Meal Name"
- inputText: "Protein Shake"
- tapOn: "Calories"
- inputText: "200"
- tapOn: "Add Food Item"
- assertVisible: "Food Item"
- assertVisible: "Food Name"
- inputText: "Protein Powder"
- tapOn: "Quantity"
- inputText: "1 scoop"
- tapOn: "Calories"
- inputText: "120"
- tapOn: "Protein (g)"
- inputText: "20"
- tapOn: "Add Food Item"
- tapOn: "Save Meal"
- assertVisible: "Meal logged successfully"

# Test meal logging cancellation
- tapOn: "Log Meal"
- assertVisible: "Log Meal"
- tapOn: "Cancel"
- assertVisible: "Nutrition"

# Test quick add meals
- tapOn: "Overview"
- assertVisible: "Quick Add Meals"
- tapOn: "Breakfast"
- assertVisible: "Quick Add Breakfast"
- tapOn: "Oatmeal"
- assertVisible: "Oatmeal added to meal"
- tapOn: "Save Meal"
- assertVisible: "Meal logged successfully"
